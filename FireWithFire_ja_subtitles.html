<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire With Fire（日本語字幕）</title>
<style>
  :root { --bg:#111; --fg:#fff; --sub:#ffe27a; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"Meiryo","Yu Gothic","Hiragino Sans",sans-serif; height:100%; }
  .wrap { display:flex; flex-direction:column; height:100vh; }
  .player { position:relative; flex:1 1 auto; min-height:0; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .cap { flex:0 0 auto; min-height:2.6em; padding:14px 24px 18px; font-size:clamp(20px, 3.2vw, 40px); line-height:1.35; text-align:center; color:var(--sub); text-shadow:0 2px 4px #000; white-space:pre-line; }
  .bar { display:flex; gap:12px; align-items:center; padding:6px 16px; font-size:13px; color:#aaa; background:#000; }
  .bar button { background:#333; color:#fff; border:1px solid #555; border-radius:6px; padding:4px 10px; cursor:pointer; }
  .bar input[type=range] { width:120px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="player">
    <iframe id="yt" src="https://www.youtube.com/embed/7-2aHIpglt4?enablejsapi=1&rel=0&modestbranding=1&cc_load_policy=0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>
  <div class="cap" id="cap">▶ Japanese sub</div>
  <div class="bar">
    <span>Fire With Fire（Ross Kauffman, 2012）　日本語字幕：熊本大学 血液・膠原病・感染症内科（授業用）</span>
    <span style="flex:1"></span>
    <label>字幕サイズ <input id="sz" type="range" min="16" max="56" value="32"></label>
    <button id="off">字幕オフ</button>
    <span id="tc">0:00</span>
  </div>
</div>
<script>
const CUES = [{"s": 7.0, "e": 16.0, "t": "テイク・ワン。\n――「がんを治す」と口にするのは難しいですか？　――いい質問ですね。"}, {"s": 16.0, "e": 23.0, "t": "なぜ言いにくいのか。私たちは本当にがんを治したい。\nただ、時には難しいのです――"}, {"s": 23.0, "e": 31.0, "t": "本当に成功するかもしれない、と考えることが。"}, {"s": 31.0, "e": 39.0, "t": "この臨床試験の患者さんたちには、もう他の選択肢が一つも残されていません。\n残念ながら、病気で亡くなる運命にある人たちです。"}, {"s": 39.0, "e": 43.0, "t": "それも、そう遠くないうちに。"}, {"s": 43.0, "e": 47.0, "t": "（エミリー・ホワイトヘッド、テイク554）"}, {"s": 47.0, "e": 53.0, "t": "エマはこのすべてについて、驚くほど淡々としています。"}, {"s": 53.0, "e": 62.0, "t": "白血病が2度も再発した子どもでした。\n両親が探していたのは――"}, {"s": 62.0, "e": 66.0, "t": "奇跡でした。"}, {"s": 66.0, "e": 72.0, "t": "私たちが学んだのは、免疫系を訓練して腫瘍細胞を見つけ、殺させる方法です。"}, {"s": 72.0, "e": 80.0, "t": "患者のT細胞を採取し、ウイルスを感染させて遺伝子を書き換える、という手順です。"}, {"s": 80.0, "e": 88.0, "t": "そうするとT細胞は自分の白血病細胞を認識し、反応するようになる。\nそれに使うのが、実はHIVウイルスなのです。"}, {"s": 88.0, "e": 97.0, "t": "――HIVを健康な細胞に感染させて、がんを殺させる、ということですか？"}, {"s": 97.0, "e": 105.0, "t": "そうです。ウイルスは病気を起こせないよう改変してあります。\nしかし免疫系を"}, {"s": 105.0, "e": 112.0, "t": "作り替える能力は残っていて、がん細胞を攻撃するようになるのです。"}, {"s": 112.0, "e": 119.0, "t": "こうして改変した免疫細胞を、私たちは「連続殺人細胞（serial killer cells）」と呼んでいます。\n輸注した細胞1個が、"}, {"s": 119.0, "e": 128.0, "t": "1,000個以上の腫瘍細胞を殺せます。\nただ現実には、新しい治療でがんが劇的に反応することは"}, {"s": 128.0, "e": 138.0, "t": "非常にまれです。家族と話すときには、効かないかもしれないとはっきり伝えなければなりません。"}, {"s": 139.0, "e": 142.0, "t": "エマはT細胞治療を受け、数日のうちに"}, {"s": 142.0, "e": 149.0, "t": "重篤な状態になりました（CRS:cytokine release syndrome）。呼吸困難と血圧低下が起こり、"}, {"s": 149.0, "e": 158.0, "t": "これ以上悪くなれば死んでしまう、というところまで来ていました。\nところがそのとき、驚くべきことが起こったのです。"}, {"s": 158.0, "e": 168.0, "t": "T細胞が増えていました。がんと戦い始めていたのです。\n数時間のうちに、エマの熱は"}, {"s": 168.0, "e": 177.0, "t": "消えました。嵐のあとの静けさのようでした。\n雲が晴れ、彼女は目を覚まし――そこに白血病は"}, {"s": 177.0, "e": 183.0, "t": "ありませんでした。"}, {"s": 183.0, "e": 191.0, "t": "あの子が助かったとき、それはもちろん、驚くべき――"}, {"s": 192.0, "e": 205.0, "t": "出来事でした。"}];
const cap = document.getElementById("cap"), tc = document.getElementById("tc"), yt = document.getElementById("yt");
let on = true, cur = -1;
document.getElementById("sz").oninput = e => cap.style.fontSize = e.target.value + "px";
document.getElementById("off").onclick = e => { on = !on; e.target.textContent = on ? "字幕オフ" : "字幕オン"; if (!on) cap.textContent = ""; };
function show(t) {
  tc.textContent = Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0");
  if (!on) return;
  let i = CUES.findIndex(c => t >= c.s && t < c.e);
  if (i !== cur) { cur = i; cap.textContent = i >= 0 ? CUES[i].t : ""; }
}
// YouTube 埋め込みプレーヤーと postMessage で通信（IFrame API スクリプトを読み込まずに再生時刻を受け取る）
function post(o) { yt.contentWindow.postMessage(JSON.stringify(o), "*"); }
yt.addEventListener("load", () => { post({event:"listening", id:1, channel:"widget"}); });
window.addEventListener("message", ev => {
  if (typeof ev.data !== "string") return;
  let d; try { d = JSON.parse(ev.data); } catch { return; }
  if (d.event === "infoDelivery" && d.info && typeof d.info.currentTime === "number") show(d.info.currentTime);
  if (d.event === "onReady") post({event:"listening", id:1, channel:"widget"});
});
// 万一 postMessage が届かない場合のフォールバック：再生中なら自前で時計を進める
let lastT = null, lastAt = 0;
window.addEventListener("message", ev => { lastAt = performance.now(); });
</script>
</body>
</html>
