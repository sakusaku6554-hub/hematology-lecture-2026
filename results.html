<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>国試クイズ 回答状況</title>
<style>
:root{--navy:#0D2340;--teal:#006E7F;--gold:#D4A017;--bg:#F3F6F9;--ink:#1a2233;--card:#fff;--line:#d5dde6;--mute:#5b6675;--bar:#8fb8c1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1722;--ink:#e8edf3;--card:#1a2534;--line:#2c3b4f;--mute:#9aa8ba;--bar:#3f6f7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Meiryo","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);color:#fff;padding:14px 28px;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(20px,3vw,34px)}
#total{font-size:clamp(16px,2.2vw,26px);color:#ffd970}
#state{margin-left:auto;font-size:clamp(13px,1.6vw,20px);color:#b9c6d8}
main{flex:1;padding:24px 28px;display:grid;gap:clamp(10px,2vh,22px);align-content:center;max-width:1200px;width:100%;margin:0 auto}
.row{display:grid;grid-template-columns:clamp(60px,8vw,110px) 1fr clamp(110px,14vw,200px);align-items:center;gap:16px}
.letter{font-size:clamp(28px,5vw,64px);font-weight:700;text-align:center;color:var(--navy);white-space:nowrap}
@media (prefers-color-scheme:dark){.letter{color:#e8edf3}}
.track{height:clamp(36px,7vh,72px);background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;background:var(--bar);transition:width .6s ease}
.row.correct .fill{background:var(--teal)}
.row.correct .track{outline:4px solid var(--gold)}
.row.correct .letter::after{content:"✓";font-size:.6em;margin-left:4px;color:var(--gold)}
.num{font-size:clamp(24px,4vw,52px);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.num small{font-size:.5em;font-weight:400;color:var(--mute);margin-left:6px}
footer{padding:10px 28px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mute)}
footer button,footer select{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
footer button.danger{border-color:#b3261e;color:#b3261e}
#msg{margin-left:auto}
</style>
</head>
<body>
<header><h1 id="title">回答状況</h1><span id="total"></span><span id="state"></span></header>
<main id="rows"></main>
<footer>
  <select id="qsel" aria-label="問題"></select>
  <button id="bAns" type="button" hidden>正解を表示</button>
  <button id="bClose" type="button">回答を締め切る</button>
  <button id="bReset" type="button" class="danger">この問題をリセット</button>
  <span id="msg"></span>
</footer>
<script src="config.js"></script>
<script>
(function(){
  var QS = window.POLL_QIDS, API = window.POLL_API, LET = ['a','b','c','d','e'];
  var P = new URLSearchParams(location.search);
  var q = P.get('q'); if (QS.indexOf(q) < 0) q = QS[0];
  var ans = (P.get('ans')||'').toLowerCase(), showAns = false, isOpen = true, timer = null;
  var $ = function(s){ return document.getElementById(s); };
  var pw = ''; try{ pw = sessionStorage.getItem('pollpw')||''; }catch(e){}

  var rows = $('rows');
  LET.forEach(function(l){
    var r = document.createElement('div'); r.className='row'; r.id='r_'+l;
    r.innerHTML = '<div class="letter">'+l+'</div><div class="track"><div class="fill" id="f_'+l+'"></div></div><div class="num" id="n_'+l+'">0<small>0%</small></div>';
    rows.appendChild(r);
  });
  var sel = $('qsel');
  QS.forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); });
  sel.value = q;
  sel.onchange = function(){ q = sel.value; ans=''; showAns=false; history.replaceState(null,'','?q='+q); apply(); tick(); };
  $('bAns').hidden = !ans;
  $('bAns').onclick = function(){ showAns = !showAns; $('bAns').textContent = showAns ? '正解を隠す' : '正解を表示'; mark(); };

  function ask(){ if (!pw){ pw = prompt('合言葉（Code.gs の PASS）') || ''; try{ sessionStorage.setItem('pollpw', pw);}catch(e){} } return pw; }
  function call(a, extra){
    if (!API) { $('msg').textContent='config.js に API URL が未設定です'; return Promise.reject(); }
    return fetch(API + '?a='+a+'&q='+q+(extra||'')).then(function(r){ return r.json(); });
  }
  function mark(){ LET.forEach(function(l){ $('r_'+l).classList.toggle('correct', showAns && ans === l); }); }
  function draw(j){
    if (!j.ok){ $('msg').textContent = j.error==='bad password' ? '合言葉が違います' : ('エラー: '+j.error); if (j.error==='bad password'){ pw=''; try{sessionStorage.removeItem('pollpw');}catch(e){} } return; }
    $('msg').textContent='';
    isOpen = j.open;
    var max = Math.max.apply(null, LET.map(function(l){ return j.counts[l]; }).concat([1]));
    LET.forEach(function(l){
      var n = j.counts[l], pct = j.total ? Math.round(n*100/j.total) : 0;
      $('f_'+l).style.width = (n/max*100)+'%';
      $('n_'+l).innerHTML = n + '<small>' + pct + '%</small>';
    });
    $('total').textContent = j.total + ' 人回答';
    $('state').textContent = j.open ? '受付中（3秒ごとに更新）' : '締切済み';
    $('bClose').textContent = j.open ? '回答を締め切る' : '受付を再開する';
  }
  function apply(){ $('title').textContent = q + ' 回答状況'; mark(); }
  function tick(){ clearTimeout(timer); call('get').then(draw).catch(function(){}).then(function(){ timer = setTimeout(tick, 3000); }); }
  $('bClose').onclick = function(){ if (!ask()) return; call(isOpen ? 'close' : 'open', '&pw='+encodeURIComponent(pw)).then(draw); };
  $('bReset').onclick = function(){ if (!confirm(q+' の回答をすべて消去します。よろしいですか？')) return; if (!ask()) return; call('reset', '&pw='+encodeURIComponent(pw)).then(draw); };
  apply(); tick();
})();
</script>
</body>
</html>
